[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zikit-sentinel"
version = "0.1.0"
description = "AIOps backend that detects, mitigates, and verifies HTTP incidents"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<25",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ai = ["google-genai>=1,<2", "mcp>=1.28,<2"]
lab = ["huggingface-hub>=0.27,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.setuptools.packages.find]
include = ["app*"]
